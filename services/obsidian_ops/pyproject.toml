[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-ops"
version = "0.1.0"
description = "Guarded Obsidian operations service for Hermes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
obsidian-ops = "obsidian_ops.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
